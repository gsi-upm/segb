services:
  # ─────────────────────────────
  # SEGB Backend (FastAPI)
  # ─────────────────────────────
  segb:
    container_name: segb-server
    image: ${SEGB_BACKEND_IMAGE:-ghcr.io/gsi-upm/semantic_ethical_glass_box/segb}:${SEGB_IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "5000:5000"
    networks:
      - internal_network
    depends_on:
      segb-query-reader-init:
        condition: service_completed_successfully
    environment:
      - LOGGING_LEVEL=DEBUG
      - VERSION=${VERSION:-stable}
      - SECRET_KEY=${SECRET_KEY:-}
      - VIRTUOSO_ENDPOINT=${VIRTUOSO_ENDPOINT:-http://segb-virtuoso:8890/sparql-auth}
      - VIRTUOSO_GRAPH_URI=${VIRTUOSO_GRAPH_URI:-http://segb/events}
      - VIRTUOSO_AUDIT_GRAPH_URI=${VIRTUOSO_AUDIT_GRAPH_URI:-http://segb/audit}
      - VIRTUOSO_USER=${VIRTUOSO_USER:-dba}
      - VIRTUOSO_PASSWORD=${VIRTUOSO_PASSWORD:?VIRTUOSO_PASSWORD_required}
      - VIRTUOSO_READER_USER=${VIRTUOSO_READER_USER:-segb_reader}
      - VIRTUOSO_READER_PASSWORD=${VIRTUOSO_READER_PASSWORD:?VIRTUOSO_READER_PASSWORD_required}
      - VIRTUOSO_READER_POLICY_RECHECK_SECONDS=${VIRTUOSO_READER_POLICY_RECHECK_SECONDS:-30}
    volumes:
      - ./logs:/logs
      - audit_dumps:/data/audit-dumps
    restart: always

  # Provision using isql from the pinned Virtuoso image; failure prevents backend startup.
  segb-query-reader-init:
    image: openlink/virtuoso-opensource-7:7.2.16@sha256:e7a5cd1915569d70d8363503dc62f6bf818b485f1501b230c7608cde8528c72d
    entrypoint: ["/bin/sh", "/provision-query-reader.sh"]
    depends_on:
      - segb-virtuoso
    environment:
      - VIRTUOSO_ISQL_ADDRESS=${VIRTUOSO_ISQL_ADDRESS:-segb-virtuoso:1111}
      - VIRTUOSO_ADMIN_USER=${VIRTUOSO_USER:-dba}
      - VIRTUOSO_ADMIN_PASSWORD=${VIRTUOSO_PASSWORD:?VIRTUOSO_PASSWORD_required}
      - VIRTUOSO_READER_USER=${VIRTUOSO_READER_USER:-segb_reader}
      - VIRTUOSO_READER_PASSWORD=${VIRTUOSO_READER_PASSWORD:?VIRTUOSO_READER_PASSWORD_required}
      - VIRTUOSO_GRAPH_URI=${VIRTUOSO_GRAPH_URI:-http://segb/events}
      - VIRTUOSO_AUDIT_GRAPH_URI=${VIRTUOSO_AUDIT_GRAPH_URI:-http://segb/audit}
      - VIRTUOSO_READER_POLICY_FILE=/reader-sql-policy.manifest
    volumes:
      - ./apps/backend/virtuoso/provision-query-reader.sh:/provision-query-reader.sh:ro
      - ./apps/backend/virtuoso/reader-sql-policy.manifest:/reader-sql-policy.manifest:ro
    networks:
      - internal_network
    restart: "no"

  # ─────────────────────────────
  # Virtuoso Triple Store
  # ─────────────────────────────
  segb-virtuoso:
    container_name: segb-virtuoso
    image: openlink/virtuoso-opensource-7:7.2.16@sha256:e7a5cd1915569d70d8363503dc62f6bf818b485f1501b230c7608cde8528c72d
    ports:
      - "8890:8890"
    environment:
      - DBA_PASSWORD=${VIRTUOSO_PASSWORD:?VIRTUOSO_PASSWORD_required}
    volumes:
      - virtuoso_data:/database
    networks:
      - internal_network

  # ─────────────────────────────
  # Frontend SEGB-UI (Vue + Nginx)
  # ─────────────────────────────
  segb-ui:
    container_name: segb-ui
    image: ${SEGB_FRONTEND_IMAGE:-ghcr.io/gsi-upm/semantic_ethical_glass_box/segb-ui}:${SEGB_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      - segb
    ports:
      - "8080:8080"
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: always

# ─────────────────────────────
# Networks
# ─────────────────────────────
networks:
  internal_network:
    driver: bridge

# ─────────────────────────────
# Persistent volumes
# ─────────────────────────────
volumes:
  audit_dumps:
  virtuoso_data:
