services:
  # ─────────────────────────────
  # Backend SEGB (FastAPI o Flask)
  # ─────────────────────────────
  amor-segb:
    container_name: amor-segb-server
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    networks:
      - internal_network
    depends_on:
      - amor-segb-neo4j
      - amor-segb-virtuoso
    environment:
      - LOGGING_LEVEL=DEBUG
      - VERSION=${VERSION}
    env_file:
      - .env
    volumes:
      - ./logs:/logs
    restart: always

  # ─────────────────────────────
  # Neo4j Database
  # ─────────────────────────────
  amor-segb-neo4j:
    container_name: amor-segb-neo4j
    image: neo4j:5.20.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neoforyou
      - NEO4J_PLUGINS=["apoc", "n10s"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - internal_network

  # ─────────────────────────────
  # Virtuoso Triple Store
  # ─────────────────────────────
  amor-segb-virtuoso:
    container_name: amor-segb-virtuoso
    image: openlink/virtuoso-opensource-7
    ports:
      - "8890:8890"
      - "1111:1111"
    environment:
      - DBA_PASSWORD=viryourbear
    volumes:
      - virtuoso_data:/database
    networks:
      - internal_network

  # ─────────────────────────────
  # Frontend SEGB-UI (Vue + Nginx)
  # ─────────────────────────────
  segb-ui:
    container_name: segb-ui
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    depends_on:
      - amor-segb
    ports:
      - "8080:8080"
    networks:
      - internal_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 3s
      retries: 10
    restart: always

# ─────────────────────────────
# Redes
# ─────────────────────────────
networks:
  internal_network:
    driver: bridge

# ─────────────────────────────
# Volúmenes persistentes
# ─────────────────────────────
volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  virtuoso_data:
