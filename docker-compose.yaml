networks:
  internal_network:
    driver: bridge

volumes:
  amor-segb-db:
  neo4j_data: # Do not use same volume for mongo and neo4j
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  virtuoso_database:
  ollama:
 
